name: Setup Flutter app
description: Setup Flutter for the mobile app workspace.

inputs:
  app-directory:
    description: Flutter app directory.
    required: false
    default: apps/mobile_flutter
  flutter-cache:
    description: Enable subosito/flutter-action cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Read Flutter SDK version from .fvmrc
      id: flutter_sdk_version
      shell: bash
      run: |
        if [ -f .fvmrc ]; then
          version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
        fi

        if [ -z "${version:-}" ]; then
          version="3.44.1"
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2.9.1
      with:
        flutter-version: ${{ steps.flutter_sdk_version.outputs.version }}
        channel: stable
        cache: ${{ inputs.flutter-cache }}

    - name: Get Flutter dependencies
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      run: flutter pub get
