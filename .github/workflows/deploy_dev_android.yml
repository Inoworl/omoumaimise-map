name: "[Release] Dev Android"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/actions/setup-flutter-app/action.yml"
      - ".github/workflows/deploy_dev_android.yml"
      - "apps/mobile_flutter/**"
      - "packages/**"
      - "pubspec.yaml"
      - "melos.yaml"
      - ".fvmrc"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    defaults:
      run:
        working-directory: apps/mobile_flutter

    steps:
      - uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-app

      - name: Setup Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile_flutter/android/**/*.gradle*
            apps/mobile_flutter/android/gradle/wrapper/gradle-wrapper.properties
            apps/mobile_flutter/pubspec.lock

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Restore Firebase config files
        run: |
          mkdir -p android/app/src/dev
          echo "${{ secrets.DEV_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/src/dev/google-services.json
          echo "${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}" | base64 -d > lib/firebase_options.dart

      - name: Restore dart-define config
        run: |
          mkdir -p dart_define
          echo "${{ secrets.DEV_DART_DEFINE_JSON_BASE64 }}" | base64 -d > dart_define/dev_dart_define.json

      - name: Validate Android deployment secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          DEV_FIREBASE_ANDROID_APP_ID: ${{ secrets.DEV_FIREBASE_ANDROID_APP_ID }}
        run: |
          missing=0
          for v in \
            ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD \
            DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 \
            DEV_FIREBASE_PROJECT_ID \
            DEV_FIREBASE_ANDROID_APP_ID; do
            if [ -z "${!v}" ]; then
              echo "::error ::Missing required secret: $v"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore Android signing keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_JKS_BASE64 }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_JKS_BASE64" | base64 -d > android/upload-keystore.jks
          test -s android/upload-keystore.jks

      - name: Create Android key.properties
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Calculate build number
        id: build_number
        run: |
          build_number="$(date +%s)"
          echo "value=$build_number" >> "$GITHUB_OUTPUT"

      - name: Build dev APK
        run: |
          version_name="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)"
          flutter build apk --release \
            --flavor dev \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define-from-file=dart_define/dev_dart_define.json \
            --target lib/main.dart \
            --build-name "$version_name" \
            --build-number "${{ steps.build_number.outputs.value }}"

      - name: Collect release notes
        run: |
          {
            echo "LATEST_COMMIT_MESSAGES<<EOF"
            git log -n 10 --pretty=format:'%s'
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Deploy to Firebase App Distribution
        env:
          DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          DEV_FIREBASE_ANDROID_APP_ID: ${{ secrets.DEV_FIREBASE_ANDROID_APP_ID }}
          DEV_FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.DEV_FIREBASE_APP_DISTRIBUTION_GROUPS }}
        run: |
          echo "$DEV_FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 -d > /tmp/dev_firebase_service_account_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/dev_firebase_service_account_key.json

          groups="${DEV_FIREBASE_APP_DISTRIBUTION_GROUPS:-internal-testers}"

          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-dev-release.apk \
            --project "$DEV_FIREBASE_PROJECT_ID" \
            --app "$DEV_FIREBASE_ANDROID_APP_ID" \
            --groups "$groups" \
            --release-notes "$LATEST_COMMIT_MESSAGES"
